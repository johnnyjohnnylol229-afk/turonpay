function ownerName(){return S.lang==='ru'?'Талгат Касымов':'TALGAT KASYMOV'}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function fmtMoney(n){var v=Number(n)||0,parts=Math.abs(v).toFixed(2).split('.');return (v<0?'−':'')+fmt(parts[0])+'.'+parts[1]}
function p2(n){return('0'+n).slice(-2)}

function dstr(d,y){return d.getDate()+' '+MON[S.lang][d.getMonth()]+(y?' '+d.getFullYear():'')}
function tstr(d,s){return p2(d.getHours())+':'+p2(d.getMinutes())+(s?':'+p2(d.getSeconds()):'')}
function rel(d){var n=new Date(),y=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1);return d.toDateString()===n.toDateString()?T('Сегодня'):d.toDateString()===y.toDateString()?T('Вчера'):dstr(d)}
function ago(a,h,m,s){var d=new Date();d.setDate(d.getDate()-a);d.setHours(h,m,s,0);return d}
function rn(){return String(Math.floor(1e9+Math.random()*9e9))}

async function startQR(){
 var status=$('#qrstatus'),video=$('#qrview');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){if(status)status.textContent=T('Камера недоступна в этом браузере. Введите код вручную.');return}
 try{
  qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  if(!$('#qrview')){stopQR();return}
  video.srcObject=qrStream;await video.play();qrActive=true;
  if(!('BarcodeDetector' in window)){status.textContent=T('Камера включена. Если QR не распознаётся, введите код вручную ниже.');return}
  var detector=new BarcodeDetector({formats:['qr_code']});
  async function detect(){
   if(!qrActive||!$('#qrview'))return;
   try{var codes=await detector.detect(video);if(codes&&codes.length&&codes[0].rawValue){var inp=$('#qrcode');if(inp)inp.value=codes[0].rawValue;var st=$('#qrstatus');if(st)st.textContent=T('QR-код распознан. Нажмите «Продолжить».');return}}catch(e){}
   qrTimer=setTimeout(detect,450);
  }
  detect();
 }catch(e){if(status)status.textContent=T('Нет доступа к камере. Разрешите доступ в Safari или введите код вручную.')}
}

function parseQrPayment(raw){
 var out={merchant:'QR-получатель',amount:0,currency:'UZS',payload:raw,kind:'unknown',payable:false,source:'raw'};
 // JSON payment payloads used by merchant integrations and test fixtures.
 try{var j=JSON.parse(raw);if(j&&typeof j==='object'){
  out.merchant=String(j.merchant||j.merchantName||j.name||j.payee||j.receiver||out.merchant);
  out.amount=Number(j.amount||j.sum||j.total||0)||0;
  out.currency=String(j.currency||j.ccy||'UZS').toUpperCase();
  out.kind=(j.type||j.scheme||j.protocol||'json').toString();
  out.payable=out.amount>0 && !!(j.merchant||j.merchantName||j.name||j.payee||j.receiver||j.iban||j.account||j.pan);
  out.source='json';return out;
 }}catch(e){}
 // URL-based payment links; only extract information, never auto-open or auto-pay.
 try{var u=new URL(raw);var p=u.searchParams;var merchant=p.get('merchant')||p.get('merchantName')||p.get('payee')||p.get('receiver')||p.get('name');var amount=Number(p.get('amount')||p.get('sum')||p.get('total')||0)||0;var currency=(p.get('currency')||p.get('ccy')||'UZS').toUpperCase();if(merchant||amount){out.merchant=merchant||u.hostname;out.amount=amount;out.currency=currency;out.kind='payment-link';out.payable=!!merchant&&amount>0;out.source='url';return out;}out.merchant=u.hostname;out.kind='url';out.source='url';return out;}catch(e){}
 // EMVCo-style TLV payloads: tag 59 merchant name, tag 53 currency, tag 54 amount.
 try{var i=0,tags={};while(i+4<=raw.length){var tag=raw.slice(i,i+2),len=parseInt(raw.slice(i+2,i+4),10);if(!/^\d{2}$/.test(tag)||!Number.isFinite(len)||len<0||i+4+len>raw.length)break;tags[tag]=raw.slice(i+4,i+4+len);i+=4+len;}if(tags['59']||tags['54']){out.merchant=tags['59']||out.merchant;out.amount=Number(tags['54']||0)||0;var cc=tags['53'];out.currency=cc==='840'?'USD':cc==='978'?'EUR':cc==='860'?'UZS':'UZS';out.kind='EMV-style QR';out.payable=!!tags['59']&&out.amount>0;out.source='emv';return out;}}catch(e){}
 out.kind=/^https?:\/\//i.test(raw)?'url':'text';return out;
}

function renderLock(){$('#lt').textContent=T('Введите PIN-код');$('#llogo').innerHTML=STAR+'<span>TURON<b>PAY</b></span>';var fb=$('#faceLoginBtn');if(!fb){fb=document.createElement('button');fb.id='faceLoginBtn';fb.className='cx';fb.textContent='◉  Войти с Face ID';fb.style.marginTop='14px';$('#lock').appendChild(fb);fb.addEventListener('click',faceLogin)}fb.style.display=S.faceEnabled?'block':'none'}
function key(k){if(k==='⌫')pin=pin.slice(0,-1);else if(/^\d$/.test(k)&&pin.length<4)pin+=k;paint();
if(pin.length===4){if(pin===S.pin){setTimeout(function(){lock.classList.remove('on');pin='';paint()},150)}else{lock.classList.add('shake');msg('Неверный PIN-код');setTimeout(function(){pin='';paint();lock.classList.remove('shake')},400)}}}
['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(function(k){var b=document.createElement('button');b.type='button';b.textContent=k;if(!k){b.style.visibility='hidden';b.disabled=true}b.addEventListener('click',function(){key(k)});$('#pad').appendChild(b)});
function relock(){closeSh();pin='';paint();lock.classList.add('on')}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSh();if(lock.classList.contains('on')){if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫')}});
try{var mf=JSON.parse(localStorage.getItem('tp_market_fx')||'null');if(mf){marketState.fx=mf.data||[];marketState.fxAt=(mf.at||'')+' · сохранённые данные'}var mc=JSON.parse(localStorage.getItem('tp_market_crypto')||'null');if(mc){marketState.crypto=mc.data||[];marketState.cryptoAt=(mc.at||'')+' · сохранённые данные'}}catch(e){}
applyTheme();applySkin();document.documentElement.lang=S.lang;render();
</script>
