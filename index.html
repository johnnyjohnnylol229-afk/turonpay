async function startQR(){
 var status=$('#qrstatus'),video=$('#qrview');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){if(status)status.textContent=T('Камера недоступна в этом браузере. Введите код вручную.');return}
 try{
  qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  if(!$('#qrview')){stopQR();return}
  video.srcObject=qrStream;await video.play();qrActive=true;
  if(!('BarcodeDetector' in window)){status.textContent=T('Камера включена. Если QR не распознаётся, введите код вручную ниже.');return}
  var detector=new BarcodeDetector({formats:['qr_code']});
  async function detect(){
   if(!qrActive||!$('#qrview'))return;
   try{var codes=await detector.detect(video);if(codes&&codes.length&&codes[0].rawValue){var inp=$('#qrcode');if(inp)inp.value=codes[0].rawValue;var st=$('#qrstatus');if(st)st.textContent=T('QR-код распознан. Нажмите «Продолжить».');return}}catch(e){}
   qrTimer=setTimeout(detect,450);
  }
  detect();
 }catch(e){if(status)status.textContent=T('Нет доступа к камере. Разрешите доступ в Safari или введите код вручную.')}
}

 sheet('<div class="facebox"><div class="faceglyph">◉</div><h3>Настройка биометрии</h3><p class="subtle-note">Проверьте поддержку биометрии на устройстве. В этой версии результат хранится локально и не заменяет серверную банковскую авторизацию.</p><button class="go" data-a="facego">Продолжить</button></div><button class="cx" data-a="close">Отмена</button>')
}
async function faceGo(){
 try{
  var challenge=new Uint8Array(32);crypto.getRandomValues(challenge);var uid=new Uint8Array(16);crypto.getRandomValues(uid);
  var cred=await navigator.credentials.create({publicKey:{challenge:challenge,rp:{name:'TURONPAY',id:location.hostname},user:{id:uid,name:'talgat-demo',displayName:'Talgat'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none'}});
  if(cred){S.faceEnabled=true;save();closeSh();render();msg('Биометрия настроена на этом устройстве')}
 }catch(e){msg('Не удалось настроить биометрию. Проверьте поддержку устройства и HTTPS.')}
}
async function faceLogin(){
 if(!S.faceEnabled){faceSetup();return}
 try{var ch=new Uint8Array(32);crypto.getRandomValues(ch);var res=await navigator.credentials.get({publicKey:{challenge:ch,rpId:location.hostname,userVerification:'required',timeout:60000}});if(res){lock.classList.remove('on');msg('Биометрическая проверка пройдена')}}catch(e){msg('Биометрическая проверка отменена')}
}
